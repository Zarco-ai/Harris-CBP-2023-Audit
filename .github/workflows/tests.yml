name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # output/harris_cbp_2023_clean.csv is committed, so the `realdata` tests
      # run here too. The 107 MB source file is not needed — nothing in the
      # suite touches the raw county file or the Census API.
      - name: Run tests
        run: pytest
